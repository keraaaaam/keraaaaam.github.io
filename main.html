<!doctype html>
<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Fraunces:opsz,wght@9..144,400;9..144,700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .heading-font { font-family: 'Fraunces', serif; }
        .project-card:hover img { transform: scale(1.05); }
        .project-card img { transition: transform 0.4s ease; }

 <body data-template-id="__page-root" class="w-full min-h-screen">
  <header class="w-full px-6 py-8 md:px-12">
   <nav class="max-w-6xl mx-auto flex justify-between items-center"><span data-template-id="nav-name" class="canva-text heading-font text-xl font-bold"></span> <a href="#contact" data-template-id="nav-cta" class="canva-button px-5 py-2 rounded-full text-sm font-medium"></a>
   </nav>
  </header>
  <main class="w-full"><!-- Hero -->
   <section class="max-w-6xl mx-auto px-6 md:px-12 py-16 md:py-24 grid md:grid-cols-2 gap-12 items-center">
    <div>
     <h1 data-template-id="hero-heading" class="canva-text heading-font text-4xl md:text-5xl leading-tight"></h1>
     <p data-template-id="hero-subtext" class="canva-text mt-6 text-lg leading-relaxed opacity-80"></p>
    </div>
    <div class="flex justify-center"><img data-template-id="hero-image" class="canva-image w-72 h-72 md:w-96 md:h-96 rounded-2xl object-cover shadow-2xl" loading="lazy">
    </div>
   </section><!-- Projects -->
   <section class="w-full px-6 md:px-12 py-16">
    <div class="max-w-6xl mx-auto">
     <h2 data-template-id="projects-heading" class="canva-text heading-font text-3xl font-bold mb-10"></h2>
     <div class="grid md:grid-cols-3 gap-8">
      <div class="project-card rounded-xl overflow-hidden" data-template-id="project-1-card">
       <div class="overflow-hidden">
        <img data-template-id="project-1-img" class="canva-image w-full h-52 object-cover" loading="lazy">
       </div>
       <div class="p-5">
        <h3 data-template-id="project-1-title" class="canva-text font-bold text-lg"></h3>
        <p data-template-id="project-1-desc" class="canva-text mt-2 text-sm opacity-70"></p>
       </div>
      </div>
      <div class="project-card rounded-xl overflow-hidden" data-template-id="project-2-card">
       <div class="overflow-hidden">
        <img data-template-id="project-2-img" class="canva-image w-full h-52 object-cover" loading="lazy">
       </div>
       <div class="p-5">
        <h3 data-template-id="project-2-title" class="canva-text font-bold text-lg"></h3>
        <p data-template-id="project-2-desc" class="canva-text mt-2 text-sm opacity-70"></p>
       </div>
      </div>
      <div class="project-card rounded-xl overflow-hidden" data-template-id="project-3-card">
       <div class="overflow-hidden">
        <img data-template-id="project-3-img" class="canva-image w-full h-52 object-cover" loading="lazy">
       </div>
       <div class="p-5">
        <h3 data-template-id="project-3-title" class="canva-text font-bold text-lg"></h3>
        <p data-template-id="project-3-desc" class="canva-text mt-2 text-sm opacity-70"></p>
       </div>
      </div>
     </div>
    </div>
   </section><!-- Contact -->
   <section id="contact" class="w-full px-6 md:px-12 py-16">
    <div class="max-w-6xl mx-auto text-center">
     <h2 data-template-id="contact-heading" class="canva-text heading-font text-3xl font-bold mb-4"></h2>
     <p data-template-id="contact-text" class="canva-text text-lg opacity-80 mb-8"></p><a href="mailto:hello@example.com" data-template-id="contact-button" class="canva-button inline-block px-8 py-3 rounded-full font-medium text-lg"></a>
    </div>
   </section>
  </main>
  <footer class="w-full px-6 md:px-12 py-8">
   <p data-template-id="footer-text" class="canva-text text-center text-sm opacity-50"></p>
  </footer>
